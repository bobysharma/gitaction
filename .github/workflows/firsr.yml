name: first react job
on: 
  push: 
  pull_request:
    branches:
      - main
jobs:
      first-job:
        runs-on: ubuntu-latest
        steps:
          - name: checkout
            uses: actions/checkout@v4
            with:
              node-version: 24
              cache: npm  
          - name: setp node js in vm
            uses: actions/setup-node@v4
            with: 
              node-version: 24
              cache: npm

          - name: install dependency
            run: npm ci
          - name: run eslint
            run: npm run lint
          - name: make react build
            run: npm run build